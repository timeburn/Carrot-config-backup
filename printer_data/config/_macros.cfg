
#############################################
##   Marlin compatibility
#############################################

#[gcode_macro M141]
#gcode:
#    SET_HEATER_TEMPERATURE HEATER=chamber TARGET={ params.S }
    
[gcode_macro SET_RETRACTIONLENGTH]
gcode:
  SET_RETRACTION RETRACT_LENGTH={params.LENGTH|float}
  GET_RETRACTION

[gcode_macro M900]
gcode:
  {% if 'K' in params %}
    {% if 'E' in params %}
      SET_PRESSURE_ADVANCE EXTRUDER={params.E} ADVANCE={params.K}
    {% else %}
      SET_PRESSURE_ADVANCE ADVANCE={params.K}
    {% endif %}
  {% endif %}

[gcode_macro _DONOTHING]
gcode:

[gcode_macro START_PRINT]
gcode:
  {% set bed_temp = params.BED|default(40)|int %}
  {% set extruder_temp = params.EXTRUDER|default(200)|float %}
  {% set chamber_temp = params.CHAMBER|default(0)|int %}
  {% set adaptive_mesh = params.ADAPTIVE|default(1)|int %}
  {% set bed_mesh = params.BEDMESH|default(1)|int %}
  {% set heat_soak = params.HEATSOAK|default( bed_temp|float * 3000 )|float %}
  SET_LED LED="lightset0" RED=1 GREEN=1 BLUE=1 SYNC=0 TRANSMIT=1
  SET_LED LED="lightset1" RED=1 GREEN=1 BLUE=1 SYNC=0 TRANSMIT=1
  G90 ; use absolute coordinates
  M83 ; extruder relative mode
  M104 S160
  M140 S{bed_temp}
  G28 X Y
  #SET_HEATER_TEMPERATURE SENSOR="chamber" heater=chamber TARGET={chamber_temp}
  M117 Initial Homing
  G28 Z 
  Z_TILT_ADJUST
  ; lift head to heat
  G1 Z10 F1200
  SET_LED LED="lightset0" RED=0.2 GREEN=0.1 BLUE=0.6 SYNC=0 TRANSMIT=1
  SET_LED LED="lightset1" RED=0.2 GREEN=0.1 BLUE=0.6 SYNC=0 TRANSMIT=1
  M117 Waiting on bed
  M190 S{bed_temp}
  ;heat soak
  {%if heat_soak > 0 %}
    M117 Heat Soak
    G4 S{ bed_temp|float * 600000 }%
  {% endif %}
  ;adaptive bedmesh
  {% if bed_mesh > 0 %}
    BED_MESH_CALIBRATE ADAPTIVE={adaptive_mesh}
  {% endif %}
 ; move to front to heat
  M117 Preheating to clean nozzle
  G1 X195 Y-25 Z10 F6000
  M109 S{extruder_temp}
  M104 S160 
  _WIPENOZZLE
  M117 cooldown for probe
  G1 X195 Y230 Z10 F6000
  M109 S160
  M117 Calibrating Z offset
  CARTOGRAPHER_TOUCH_HOME                
  #SET_GCODE_OFFSET Z=-0.02 MOVE=1
  M117 Waiting on Extruder
  SET_LED LED="lightset0" RED=1 GREEN=1 BLUE=1 SYNC=0 TRANSMIT=1
  SET_LED LED="lightset1" RED=1 GREEN=1 BLUE=1 SYNC=0 TRANSMIT=1
  M104 S{extruder_temp}
  #G1 X10 Y10 F12000
  G90
  G1 Z2 F1200
  G1 X195 Y-20 Z5 F6000
  ; Wait for tools
  M109 S{extruder_temp}
  POOP
  ; wipe on brush
  _WIPENOZZLE
  G92 E0
  G10
  G1 Z5 F1200
  G11
  ;start filter
  UPDATE_DELAYED_GCODE ID=_startnevermore DURATION=180
  M117 Printing

[gcode_macro END_PRINT]
gcode:
  G10 
  M106 S0
  M104 S0
  M140 S0
  #M141 S0
  M900 K0
  G91
  G1 Z+5 F1500
  G90
  G1 X300 Y-20 F3000
  G91 
  G1 Z+100 F1200
  G90
  M84
  M117 Print Complete
  UPDATE_DELAYED_GCODE ID=_stopnevermore DURATION=300
  SET_LED LED="lightset0" RED=0 GREEN=0 BLUE=0 SYNC=0 TRANSMIT=1
  SET_LED LED="lightset1" RED=0 GREEN=0 BLUE=0 SYNC=0 TRANSMIT=1
  
[gcode_macro CANCEL_PRINT]
gcode:
  G91 
  G1 Z+100 F1200
  G90
  UPDATE_DELAYED_GCODE ID=_startnevermore DURATION=0
  UPDATE_DELAYED_GCODE ID=_stopnevermore DURATION=300

[gcode_macro PRINT_START]
gcode:
    START_PRINT {rawparams}

[gcode_macro PRINT_END]
gcode:
    END_PRINT {rawparams}


[gcode_macro M108]
gcode:
    CANCEL_PRINT

[gcode_macro _PANICTHERMALRUNAWAY]
gcode:
  M118 Bed overtemp, fuse failed!
  M112

[gcode_macro _PANICBUTTON]
gcode:
  M118 EMERGENCY STOP PRESSED
  M112

[delayed_gcode _startnevermore]
gcode:
  SET_FAN_SPEED FAN=nevermore SPEED=1 

[delayed_gcode _stopnevermore]
gcode:
  SET_FAN_SPEED FAN=nevermore SPEED=0

[gcode_macro _sexboltpressed]
gcode:
  M118 Sexbolt Pressed!

[gcode_macro _WIPENOZZLE]
gcode:
  G1 X195 Y-1 F15000
  G4 P8000
  M117 Cleaning nozzle.
  G4 P2000
  G1 Z0.2
  G1 X350 F3000
  G1 X300 F3000
  G1 X350 F3000
  G1 Z5 F3000
  G1 X195
  M117 Nozzle cleaned


[gcode_macro PARKPOSITION]
gcode:
  G1 X195 Y-1 F15000
  

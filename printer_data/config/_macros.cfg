[gcode_macro SET_RETRACTIONLENGTH]
gcode:
  SET_RETRACTION RETRACT_LENGTH={params.LENGTH|float}
  GET_RETRACTION

[gcode_macro M900]
gcode:
  {% if 'K' in params %}
    {% if 'E' in params %}
      SET_PRESSURE_ADVANCE EXTRUDER={params.E} ADVANCE={params.K}
    {% else %}
      SET_PRESSURE_ADVANCE ADVANCE={params.K}
    {% endif %}
  {% endif %}

[gcode_macro _DONOTHING]
gcode:

[gcode_macro LOAD_FILAMENT]
gcode:

[gcode_macro UNLOAD_FILAMENT]
gcode:



[gcode_macro _THEPOSITION]
gcode:
  ##### get user parameters or use default #####
  {% set client = printer['gcode_macro _CLIENT_VARIABLE']|default({}) %}
  {% set velocity = printer.configfile.settings.pause_resume.recover_velocity %}
  {% set x_park  = client.custom_park_x|default(0.0) %}
  {% set y_park  = client.custom_park_y|default(0.0) %}
  {% set sp_move = client.speed_move|default(velocity) * 60 %}
  ##### end of definitions #####
  {% if "xyz" in printer.toolhead.homed_axes %}
    G1 X{x_park} Y{y_park} F{sp_move}
    {% if not printer.gcode_move.absolute_coordinates %} 
      G91 
    {% endif %}
  {% else %}
    RESPOND TYPE=echo MSG='Printer not homed'
  {% endif %}
  
[gcode_macro START_PRINT]
variable_touch_x: 320
variable_touch_y: 330
variable_homing_speed: 30000
variable_globaloffset: 0
variable_smoothoffset: 0.1
gcode:
  {% set bed_temp = params.BED|default(40)|int %}
  {% set extruder_temp = params.EXTRUDER|default(200)|float %}
  {% set chamber_temp = params.CHAMBER|default(0)|int %}
  {% set adaptive_mesh = params.ADAPTIVE|default(1)|int %}
  {% set bed_mesh = params.BEDMESH|default(1)|int %}
  {% set heat_soak = params.HEATSOAK|default( bed_temp|float * 3000 )|float %}
  {% set tool = params.TOOL|default(-1)|int %}
  {% set current_gate = printer.ace.current_gate|default(-1)|int %}
  {% if (plate == "High Temp Plate") or ( plate == "Cool Plate") %}
    {% set plateoffset = smoothoffset %}
  {% else %}
    {% set plateoffset = 0 %}
  {% endif %}
  SET_LED LED="lightset0" RED=1 GREEN=1 BLUE=1 SYNC=0 TRANSMIT=1
  SET_LED LED="lightset1" RED=1 GREEN=1 BLUE=1 SYNC=0 TRANSMIT=1
  G90 ; use absolute coordinates
  M83 ; extruder relative mode
  M104 S160
  M140 S{bed_temp}
  {%if chamber_temp > 0 %} 
    SET_HEATER_TEMPERATURE SENSOR="chamber" heater=chamber TARGET={chamber_temp}
  {% endif %}  
  _MAKEBED  #homes and does z-tilt, but only if not homed or not tilted
  _THEPOSITION  #ASSUME THE POSITION Park for heating/changing/pooping
  SET_LED LED="lightset0" RED=0.2 GREEN=0.1 BLUE=0.6 SYNC=0 TRANSMIT=1
  SET_LED LED="lightset1" RED=0.2 GREEN=0.1 BLUE=0.6 SYNC=0 TRANSMIT=1
  M117 Waiting on bed
  M190 S{bed_temp}
  ;heat soak
  {%if heat_soak > 0 %}
    M117 Heat Soak
    G4 S{ bed_temp|float * 600000 }%
  {% endif %}
  ;adaptive bedmesh
  {% if bed_mesh > 0 %}
    BED_MESH_CALIBRATE ADAPTIVE={adaptive_mesh}
  {% endif %}
  G1 Z5
  M104 S{extruder_temp}
  #move to pre-prime location as we heat
  _THEPOSITION
  M117 Heating to clean nozzle
  {% if extruder_temp < 280 %}
    M104 S280
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM=280 
  {% else %}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={extruder_temp}
  {% endif %}
  M117 Cooling to probe bed
  M104 S160
  TEMPERATURE_WAIT SENSOR=extruder MAXIMUM=200
  WIPE
  M109 S160
  G4 P500
  M117 Calibrating Z 
  G1 X{touch_x} Y{touch_y} F{homing_speed} 
  CARTOGRAPHER_TOUCH_HOME 
  SET_GCODE_OFFSET Z={globaloffset}
  {% if plateoffset > 0 %}
    SET_GCODE_OFFSET Z_ADJUST={plateoffset}
  {% endif %}
  M104 S{extruder_temp}
  G1 Z5
  M117 Waiting on Extruder
  SET_LED LED="lightset0" RED=1 GREEN=1 BLUE=1 SYNC=0 TRANSMIT=1
  SET_LED LED="lightset1" RED=1 GREEN=1 BLUE=1 SYNC=0 TRANSMIT=1
  #G1 X10 Y10 F12000
  _THEPOSITION
  ; Wait for tools
  M109 S{extruder_temp}
  {% if tool > -1 %}
    {% if current_gate != tool %}
      M117 Loading gate {tool}
      ACE_CHANGE_TOOL GATE={tool}
    {% endif %}    
  {% else %}
    M117 Purging...
    POOP
    WIPE
  {% endif %}
  G11
  ;start filter
  UPDATE_DELAYED_GCODE ID=_startnevermore DURATION=180
  M117 Printing...

[gcode_macro END_PRINT]
gcode:
  {% set current_gate = printer.ace.current_gate|default(-1)|int %}
  M400
  G91
  G1 Z+5 F1500
  G90
  _THEPOSITION
  {% if tool > -1 %}
    {% if current_gate != -1 %}
      ACE_CHANGE_TOOL GATE=-1
    {% endif %}    
 {% endif %}
  M106 S0
  M107
  M104 S0
  M140 S0
  #M141 S0
  M501
  M84
  M117 Print Complete
  UPDATE_DELAYED_GCODE ID=_stopnevermore DURATION=300
  SET_LED LED="lightset0" RED=0 GREEN=0 BLUE=0 SYNC=0 TRANSMIT=1
  SET_LED LED="lightset1" RED=0 GREEN=0 BLUE=0 SYNC=0 TRANSMIT=1

[gcode_macro PRINT_START]
gcode:
    START_PRINT {rawparams}

[gcode_macro PRINT_END]
gcode:
    END_PRINT {rawparams}

[gcode_macro _MAKEBED]
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    {% if printer.z_tilt_ng.applied != True %}
        Z_TILT_ADJUST
    {% endif %}    

[gcode_macro M501]
gcode:
  {% set pareset = printer.configfile.settings.extruder.pressure_advance|float %}
  SET_PRESSURE_ADVANCE EXTRUDER=extruder ADVANCE={pareset}
  BED_MESH_CLEAR
  SET_GCODE_OFFSET Z=0.0
  
[gcode_macro M108]
gcode:
    CANCEL_PRINT

[gcode_macro _PANICTHERMALRUNAWAY]
gcode:
  M118 Bed overtemp, fuse failed!
  M112

[gcode_macro _PANICBUTTON]
gcode:
  M118 EMERGENCY STOP PRESSED
  M112

[delayed_gcode _startnevermore]
gcode:
  SET_FAN_SPEED FAN=nevermore SPEED=1 

[delayed_gcode _stopnevermore]
gcode:
  SET_FAN_SPEED FAN=nevermore SPEED=0

[gcode_macro DUMP_VARIABLES]
gcode:
    {% set filter_name = params.NAME|default('')|string|lower %}
    {% set filter_value = params.VALUE|default('')|string|lower %}
    {% set show_cfg = params.SHOW_CFG|default(0)|int %}
    
    {% set out = [] %}

    {% for key1 in printer %}
        {% for key2 in printer[key1] %}
            {% if (show_cfg or not (key1|lower == 'configfile' and key2|lower in ['config', 'settings'])) and (filter_name in key1|lower or filter_name in key2|lower) and filter_value in printer[key1][key2]|string|lower %}
                {% set dummy = out.append("printer['%s'].%s = %s" % (key1, key2, printer[key1][key2])) %}
            {% endif %}
        {% else %}
            {% if filter_name in key1|lower and filter_value in printer[key1]|string|lower %}
                {% set dummy = out.append("printer['%s'] = %s" % (key1, printer[key1])) %}
            {% endif %}
        {% endfor %}
    {% endfor %}
    
    {action_respond_info(out|join("\n"))}


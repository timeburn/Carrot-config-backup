[gcode_macro M106]
gcode:
  ##### get user parameters or use default #####
  {% set client = printer['gcode_macro _CLIENT_VARIABLE']|default({}) %}
  {% set active_tool = client.active_tool|default(0)|int %}  
  {% if params.S is defined %}
    {% set partfan_speed = params.S|default(0)|int %}
    SET_GCODE_VARIABLE MACRO=_CLIENT_VARIABLE VARIABLE=partfan_speed VALUE={ params.S }
    {% if params.P is defined %}
      {% set targettool = params.P|default(0)|int %}
       {% if targettool == 0 %}
        SET_FAN_SPEED FAN=t0fan SPEED={partfan_speed}
       {% else %}
        SET_FAN_SPEED FAN=t1fan SPEED={partfan_speed}
       {% endif %}
      {% else %}
        {% if printer.dual_carriage.carriage_0 == "PRIMARY" %}
          SET_FAN_SPEED FAN=t0fan SPEED={partfan_speed}
        {% endif %}        
        {% if printer.dual_carriage.carriage_1 == "PRIMARY" %}
            SET_FAN_SPEED FAN=t1fan SPEED={partfan_speed}
        {% elif printer.dual_carriage.carriage_1 == "MIRROR" or printer.dual_carriage.carriage_1 == "COPY"  %}
            SET_FAN_SPEED FAN=t1fan SPEED={partfan_speed}
        {% endif %}
      {% endif %}
    {% endif %}

[gcode_macro M107]
gcode:
  SET_GCODE_VARIABLE MACRO=_CLIENT_VARIABLE VARIABLE=partfan_speed VALUE={ params.S }
  SET_FAN_SPEED FAN=t0fan SPEED=0
  SET_FAN_SPEED FAN=t1fan SPEED=0

  
[gcode_macro CUT_FILAMENT]
gcode:
  {% set client = printer['gcode_macro _CLIENT_VARIABLE']|default({}) %}
  {% set active_tool = client.active_tool|default(0)|int %}
  # save state, then park active extruder
  SAVE_DUAL_CARRIAGE_STATE
  G91
  G1 Z+2 
  G90
  PARK_{printer.toolhead.extruder}
  # move to pre-cutting position 
  G1 X601 F18000
  # move carriages away from edges to clear cutting levers
  force_move stepper=dual_carriage distance=-15 velocity=30 accel=1000
  force_move stepper=stepper_y distance=15 velocity=30 accel=1000
  # move to cutting position
  g1 X610 F3000
  {% if params.T == 0 %}
    _CUT_T0
  {% elif params.T == 1 %}
    _CUT_T1
  {% elif params.T == 2 %}
    _CUT_T0
    _CUT_T1
  {% else %}
    _CUT_T{ active_tool }
  {% endif %}
  # move back to printable area
  g1 X600 F3000
  # move carriages back to parked position
    force_move stepper=dual_carriage distance=15 velocity=30 accel=1000
  force_move stepper=stepper_y distance=-15 velocity=30 accel=1000
  
[gcode_macro _cut_t0]
gcode:
  {% if printer.toolhead.position.x == 610 %}
    force_move stepper=stepper_y distance=-10 velocity=30 accel=1000
    force_move stepper=stepper_y distance=10 velocity=30 accel=1000
  {% else %}
    RESPOND TYPE=error MSG="Toolhead not in cuttting position"
  {% endif %}
  
[gcode_macro _cut_t1]
gcode:
  {% if printer.toolhead.position.x == 610 %}
    force_move stepper=dual_carriage distance=10 velocity=30 accel=1000
    force_move stepper=dual_carriage distance=-10 velocity=30 accel=1000
  {% else %}
    RESPOND TYPE=error MSG="Toolhead not in cuttting position"
  {% endif %}


[gcode_macro LOAD_FILAMENT]
gcode:
  LOAD_PROMPT

[gcode_macro UNLOAD_FILAMENT]
gcode:
    SAVE_GCODE_STATE NAME=unload_state    
    {% if printer["filament_switch_sensor t0insert"].filament_detected == true %}
      filament_unload_init
    {% else %}
      SET_DISPLAY_TEXT MSG="No filament detected at tool0"
    {% endif %}
    RESTORE_GCODE_STATE NAME=unload_state

[gcode_macro _UNLOADTOOL0]
gcode:
  {% if printer["filament_switch_sensor t0insert"].filament_detected == false %}
    force_move stepper="extruder_stepper mobius0" distance=-2100 velocity=50 accel=100
  {% else %}
    SET_DISPLAY_TEXT MSG="Filament unload failed.  Please unload manually."
  {% endif %}
  

[gcode_macro _PRELOAD0]
description: Begins filament loading process from top loader.    Activated by loader insert sensor
# should start interactive prompts.    <20mm from gears to exit sensor
# delayed gcode to error if next macro is not run in (10) seconds:   "filament does not appear to be loading, retry?"
gcode:
  {% if printer["gcode_button loader0out"].state == "PRESSED" %}
    M118 Filament already loaded!
  {% else %}
    UPDATE_DELAYED_GCODE ID=clear_loadbusy DURATION=2
    force_move stepper="extruder_stepper mobius0" distance=20 velocity=5 accel=1000  
  {% endif %}
  _INITLOADER0
  
[gcode_macro _LOADOUT0]
description: Pulls loaded filament from loader all the way to the toolhead.   Activated by loader exit sensor.
#  ~1800mm from exit sensor to t0 insert.
# disable prior delayed gcode, start another for t0 insert timeout
gcode:
  {% if printer["gcode_button loader0out"].state == "PRESSED" %}
    {% if printer["filament_switch_sensor t0insert"].filament_detected == false %}
      force_move stepper="extruder_stepper mobius0" distance=1850 velocity=100 accel=100
    {% endif %}
  {% endif %}

  
[gcode_macro _INITLOADER0]
gcode:
  {% if printer["gcode_button loader0out"].state == "PRESSED" %}
    {% if printer["filament_switch_sensor loader0in"].filament_detected == true %}
      filament_load_init
    {% endif %}
  {% endif %}
  
  filament_load_init

[gcode_macro _PURGET0]
description: Loads filament fully into hotend and initiates purge.  Triggered by t0 cutter sensor.
gcode:

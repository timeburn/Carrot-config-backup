
[board_pins loader]
mcu: loader, loader1
aliases:
    # Bigtreetech EBB42 v1.2 CAN
    # Stepper drivers
    S0_STEP=PD0,  S0_DIR=PD1,  S0_EN=PD2, S0_CS=PA15, 
    
    # Heaters
    HEAT0=PB13,

    # Thermisors
    HEAT0_TEMP=PA3,

    # Fans
    FAN0=PA0, FAN1=PA1,

    # End stops
    STOP0=PB5,  STOP1=PB6, STOP2=PB7,

    #rgb led
    RGB0=PD3,

    # BL Touch
    SERVO=PB9,   # BL Touch servo pin
    PROBE=PB8,  # BL Touch end stop pin

    #Max31865
    MAX_SPI_CS=PA4,
    MAX_SPI_SCLK=PA5,
    MAX_SPI_MISO=PA6,
    MAX_SPI_MOSI=PA7,

    #adxlspi
    AXL_SPI_CS=PB12,
    AXL_SPI_SCLK=PB10,
    AXL_SPI_MISO=PB2,
    AXL_SPI_MOSI=PB11,
    
    #I2C
    I2CSDA=PB3,
    I2CSCL=PB4


[filament_switch_sensor t5in]
pause_on_runout: true
switch_pin: ^STOP4   # Please replace with the actual pin you are using
runout_gcode:
    PAUSE
    RESPOND MSG="Filament runout detected, printing paused"
insert_gcode:
    RESPOND MSG="Filament inserted, preparing to resume printing"
event_delay: 2.0    # Event trigger delay (seconds)
pause_delay: 2.0     # Pause command delay (seconds)
debounce_delay: 2.0  # Debounce delay (seconds)

[gcode_button t5y]
pin: ^!STOP3
press_gcode:
  _LOADERINSERT
release_gcode: 
  _LOADERRETRACT
debounce_delay: 2

[gcode_macro _LOADERINSERT]
gcode: 
  M117 Reached splitter
  BUFFER_STOP

[gcode_macro _LOADERRETRACT]
gcode:
  M117 Exiting splitter
  BUFFER_STOP
  

# Define buffer feed control pin
[output_pin _buffer_feed]
pin: UART2_RX        # Replace with your actual connected pin (connected to buffer PB5)
value: 1           # Initial state is high level (not triggered)
shutdown_value: 1  # Maintain high level when Klipper stops

# Define buffer retract control pin
[output_pin _buffer_retract]
pin: UART2_TX       # Replace with your actual connected pin (connected to buffer PB6)
value: 1           # Initial state is high level (not triggered)
shutdown_value: 1  # Maintain high level when Klipper stops

# Buffer feed macro
[gcode_macro BUFFER_FEED]
description: Control buffer feeding
gcode:
    # Set feed pin to low level, triggering buffer feed
    SET_PIN PIN=_buffer_feed VALUE=0
    M118 "Buffer started feeding"
    
    # Optional: Automatically stop after a period
    # G4 P3000  # Wait 3 seconds
    # SET_PIN PIN=_buffer_feed VALUE=1
    # M118 "Buffer stopped feeding"

# Buffer retract macro
[gcode_macro BUFFER_RETRACT]
description: Control buffer retracting
gcode:
    # Set retract pin to low level, triggering buffer retract
    SET_PIN PIN=_buffer_retract VALUE=0
    M118 "Buffer started retracting"
    
    # Optional: Automatically stop after a period
    # G4 P2000  # Wait 2 seconds
    # SET_PIN PIN=_buffer_retract VALUE=1
    # M118 "Buffer stopped retracting"

# Stop all actions macro
[gcode_macro BUFFER_STOP]
description: Stop all buffer actions
gcode:
    SET_PIN PIN=_buffer_feed VALUE=1
    SET_PIN PIN=_buffer_retract VALUE=1
    M118 "Buffer stopped"
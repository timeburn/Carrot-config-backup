[cartographer]
mcu: cartographer            
x_offset: 20                          
y_offset: 0                         

[cartographer touch]
#samples: 5
#   The number of samples to use when doing a touch.
#   The default is 5.
max_samples: 15
#   The maximum number of samples to do before giving up.
#   The default is samples * 2.
UNSAFE_max_touch_temperature: 175
EXPERIMENTAL_home_random_radius: 2


[safe_z_home]
home_xy_position: 600,-25  #320, 300
# Example home_xy_position: 175,175 - This would be for a 350 * 350mm bed. 
z_hop: 10
speed: 300
#home_y_before_x: True

[bed_mesh]
speed: 500
probe_count: 10, 10
mesh_min: 40,30
mesh_max: 600,630
algorithm: bicubic
zero_reference_position: 320,330  #320.00,300.00
bed_mesh_default: default
adaptive_margin: 10
mesh_pps: 0,0
horizontal_move_z: 3

[z_tilt_ng]
z_positions: -158, -26
  -158, 686
  674, 686
  674,-26
points: 40,40
  40,620
  600,620
  600,40
extra_points: 40,230
  40,430
  190,620
  320,620
  470,620
  600,430
  600,230
  470,30
  320,30
  190,30
  190,230
  190,430
  320,430
  470,430
  470,230
  320,330
speed: 500
horizontal_move_z: 10.0
min_horizontal_move_z: 2.0
adaptive_horizontal_move_z: True
retries: 10
retry_tolerance: 0.4
increasing_threshold: 0.01  #0.0000001

[adxl345]
cs_pin: cartographer:PA3
spi_bus: spi1

[resonance_tester]
accel_chip: adxl345
probe_points:
    300,320,10


    
    